<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block subject %}SoHo Pittsburgh{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f4f0;font-family:Georgia,serif;">

  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f4f0;">
    <tr>
      <td align="center" style="padding:32px 16px;">

        <!-- Card -->
        <table width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background-color:#ffffff;border:1px solid #e5e2db;">

          <!-- Header -->
          <tr>
            <td style="background-color:#1a1a1a;padding:32px 40px;text-align:center;">
              <p style="margin:0 0 4px 0;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#c9972a;font-family:sans-serif;">SoHo Pittsburgh</p>
              <p style="margin:0;font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,255,255,0.45);font-family:sans-serif;">203 Federal St &nbsp;&bull;&nbsp; Pittsburgh, PA</p>
            </td>
          </tr>

          <!-- Gold rule -->
          <tr>
            <td style="height:3px;background-color:#c9972a;font-size:0;line-height:0;">&nbsp;</td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:36px 40px 32px 40px;">
              {% block body %}{% endblock %}
            </td>
          </tr>

          {% block cta %}{% endblock %}

          <!-- Footer rule -->
          <tr>
            <td style="padding:0 40px;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="height:1px;background-color:#e5e2db;font-size:0;line-height:0;">&nbsp;</td></tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:24px 40px;text-align:center;">
              <p style="margin:0 0 6px 0;font-size:12px;color:#888888;font-family:sans-serif;">
                SoHo Pittsburgh &nbsp;&bull;&nbsp; 203 Federal St, Pittsburgh, PA 15212
              </p>
              {% block footer_extra %}{% endblock %}
            </td>
          </tr>

        </table>
        <!-- /Card -->

      </td>
    </tr>
  </table>

</body>
</html>
