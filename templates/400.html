<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bad Request — SoHo Pittsburgh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Raleway:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg:      #0a0a0a;
      --color-surface: #111111;
      --color-text:    #f5f0e8;
      --color-muted:   rgba(245,240,232,0.55);
      --color-gold:    #c9a84c;
      --color-gold-dk: #a8893a;
      --font-heading:  'Cinzel', Georgia, serif;
      --font-body:     'Raleway', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1.25rem 2rem;
      border-bottom: 1px solid rgba(201,168,76,0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-text);
      text-decoration: none;
    }

    .logo em { font-style: normal; color: var(--color-gold); }

    .home-link {
      font-family: var(--font-body);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-gold);
      text-decoration: none;
      border: 1px solid var(--color-gold);
      padding: 0.45rem 1.1rem;
      border-radius: 9999px;
      transition: background 0.2s, color 0.2s;
    }

    .home-link:hover { background: var(--color-gold); color: var(--color-bg); }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5rem 1.5rem;
    }

    .body { text-align: center; max-width: 34rem; }

    .code {
      font-family: var(--font-body);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--color-gold);
      margin-bottom: 1rem;
    }

    h1 {
      font-family: var(--font-heading);
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      font-weight: 700;
      line-height: 1.15;
      color: var(--color-text);
      margin-bottom: 1.5rem;
    }

    .divider {
      width: 3rem;
      height: 2px;
      background: var(--color-gold);
      margin: 0 auto 2rem;
    }

    p {
      font-size: 1rem;
      line-height: 1.75;
      color: var(--color-muted);
      margin-bottom: 2.5rem;
    }

    .btn {
      display: inline-block;
      padding: 0.7rem 2rem;
      background: var(--color-gold);
      color: var(--color-bg);
      font-family: var(--font-body);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 9999px;
      transition: background 0.2s;
    }

    .btn:hover { background: var(--color-gold-dk); }

    footer {
      padding: 1.5rem 2rem;
      text-align: center;
      font-size: 0.72rem;
      color: var(--color-muted);
      border-top: 1px solid rgba(255,255,255,0.06);
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="logo">So<em>Ho</em> Pittsburgh</a>
    <a href="/" class="home-link">Home</a>
  </header>

  <main>
    <div class="body">
      <p class="code">400 &mdash; Bad Request</p>
      <h1>That Order Didn't Go Through</h1>
      <div class="divider"></div>
      <p>
        The server couldn't understand the request &mdash; it may be
        malformed or missing required information. Head back home and
        try again.
      </p>
      <a href="/" class="btn">Back to Home</a>
    </div>
  </main>

  <footer>&copy; SoHo Pittsburgh &mdash; 203 Federal Street, Pittsburgh, PA</footer>

</body>
</html>
