{# Alpine.js modal — requires x-data="{ inquiryOpen: false }" on a parent element #}
<div x-show="inquiryOpen"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     style="display:none;position:fixed;inset:0;z-index:1000;overflow-y:auto;padding:2rem 1rem;"
     @keydown.escape.window="inquiryOpen = false">

  {# Backdrop #}
  <div style="position:fixed;inset:0;background:rgba(0,0,0,0.75);" @click="inquiryOpen = false"></div>

  {# Modal panel #}
  <div style="position:relative;max-width:640px;margin:0 auto;background:var(--color-bg-primary,#111);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:2rem;"
       @click.stop>

    {# Header #}
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.5rem;">
      <div>
        <div style="font-size:0.65rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--color-gold-primary);margin-bottom:0.3rem;">Private Events</div>
        <h2 style="font-size:1.4rem;font-weight:700;color:var(--color-text-primary);">Have an Event With Us</h2>
      </div>
      <button @click="inquiryOpen = false"
              style="background:none;border:none;cursor:pointer;color:var(--color-text-secondary);font-size:1.5rem;line-height:1;padding:0.25rem;">
        &times;
      </button>
    </div>

    {# Form (swapped by Alpine on submit) #}
    <div data-inquiry-form>
      {% include 'core/partials/event_inquiry_form.html' %}
    </div>

  </div>
</div>
