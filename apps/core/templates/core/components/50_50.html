{% if left or right %}
<section class="w-full">
  <div class="grid md:grid-cols-2">

    {% if left %}
    <div style="background-color: var(--color-{{ left.bg_color|default:'bg-primary' }}); min-height: 24rem;">
      {% include "core/components/_panel_side.html" with panel=left %}
    </div>
    {% endif %}

    {% if right %}
    <div style="background-color: var(--color-{{ right.bg_color|default:'bg-secondary' }}); min-height: 24rem;">
      {% include "core/components/_panel_side.html" with panel=right %}
    </div>
    {% endif %}

  </div>
</section>
{% endif %}
