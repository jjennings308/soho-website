{% extends "staff/base.html" %}
{% block title %}Upload Photo{% endblock %}
{% block page_title %}Upload Photo{% endblock %}
{% block topbar_actions %}
  <a href="{% url 'staff:gallery' %}" class="sp-btn sp-btn--outline">← Back</a>
{% endblock %}

{% block content %}
<div style="max-width:520px;">
  <div class="sp-card">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="sp-field">
        <label class="sp-label">Photo</label>
        <input class="sp-input" type="file" name="image" accept="image/*" required>
        {% if form.image.errors %}<div class="sp-field-error">{{ form.image.errors.0 }}</div>{% endif %}
      </div>

      <div class="sp-field">
        <label class="sp-label">Caption <span style="color:var(--color-mid-gray);font-weight:400;">(optional)</span></label>
        <input class="sp-input" type="text" name="caption" value="{{ form.caption.value|default:'' }}" placeholder="Short description shown in lightbox">
      </div>

      <div class="sp-field">
        <label class="sp-label">Category</label>
        <select class="sp-select" name="category">
          <option value="">— None —</option>
          {% for cat in form.fields.category.queryset %}
            <option value="{{ cat.pk }}" {% if form.category.value == cat.pk %}selected{% endif %}>{{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="sp-field">
        <label class="sp-label">Menu Item <span style="color:var(--color-mid-gray);font-weight:400;">(optional — links photo to a menu item)</span></label>
        <select class="sp-select" name="menu_item">
          <option value="">— None —</option>
          {% for item in form.fields.menu_item.queryset %}
            <option value="{{ item.pk }}" {% if form.menu_item.value == item.pk %}selected{% endif %}>{{ item.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="sp-field" style="max-width:140px;">
        <label class="sp-label">Display Order</label>
        <input class="sp-input" type="number" name="display_order" value="{{ form.display_order.value|default:'0' }}" min="0">
      </div>

      <div style="display:flex;gap:0.75rem;margin-top:1.5rem;">
        <button type="submit" class="sp-btn sp-btn--primary">Upload</button>
        <a href="{% url 'staff:gallery' %}" class="sp-btn sp-btn--outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
