{% extends "base.html" %}
{% block title %}Unsubscribed{% endblock %}
{% block content %}
<section class="max-w-2xl mx-auto px-4 py-20 text-center">
  <h1 class="text-3xl font-bold text-brand-primary mb-4">You've been unsubscribed</h1>
  <p class="text-text-secondary text-lg">
    Sorry to see you go, {{ member.first_name }}. You've been removed from the SoHo Pittsburgh mailing list and won't receive any further emails.
  </p>
  <a href="{% url 'core:home' %}" class="mt-8 inline-block px-8 py-3 bg-brand-primary text-white font-semibold rounded hover:opacity-90 transition">
    Back to Home
  </a>
</section>
{% endblock %}
