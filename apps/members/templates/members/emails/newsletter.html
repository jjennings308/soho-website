<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ newsletter.subject }}</title>
</head>
<body style="font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 24px; color: #222;">
  <h1 style="font-size: 22px; margin-bottom: 24px;">{{ newsletter.subject }}</h1>

  <div>
    {{ newsletter.body|safe }}
  </div>

  <hr style="border: none; border-top: 1px solid #eee; margin: 32px 0;">
  <p style="color: #999; font-size: 12px;">
    SoHo Pittsburgh &mdash; 203 Federal St, Pittsburgh, PA 15212<br>
    {% if unsubscribe_url %}
    <a href="{{ unsubscribe_url }}" style="color: #999;">Unsubscribe</a>
    {% endif %}
  </p>
</body>
</html>
