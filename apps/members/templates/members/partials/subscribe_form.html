{% if success %}
  <div class="text-center py-6" data-subscribed="true">
    <p style="font-size:1.1rem;font-weight:600;color:var(--color-accent-red);">Almost there!</p>
    <p style="margin-top:0.5rem;color:var(--color-text-secondary);">Check your email and click the confirmation link to complete your subscription.</p>
  </div>

{% elif already_subscribed %}
  <div class="text-center py-6" data-subscribed="true">
    <p style="color:var(--color-text-secondary);">You're already subscribed. Thanks for being part of the SoHo family!</p>
  </div>

{% else %}
  <form method="post" action="{% url 'members:subscribe' %}"
        x-data="{ loading: false }"
        @submit.prevent="
          loading = true;
          const widget = $el.closest('[data-subscribe-widget]');
          fetch($el.action, { method: 'POST', headers: { 'X-CSRFToken': '{{ csrf_token }}' }, body: new FormData($el) })
            .then(r => r.text())
            .then(html => {
              widget.innerHTML = html;
              if (widget.querySelector('[data-subscribed]')) {
                localStorage.setItem('soho_subscribed', '1');
              }
            })
            .finally(() => { loading = false; });
        ">
    {% csrf_token %}

    {% if error %}
      <p style="margin-bottom:0.75rem;font-size:0.875rem;color:var(--color-accent-red);">{{ error }}</p>
    {% endif %}

    <div style="display:flex;flex-wrap:wrap;gap:0.75rem;">
      <input
        type="text"
        name="first_name"
        placeholder="First name"
        required
        style="flex:1;min-width:140px;padding:0.5rem 1rem;border:1px solid var(--color-footer-divider);border-radius:4px;background:var(--color-bg-primary);color:var(--color-text-primary);outline:none;"
        onfocus="this.style.borderColor='var(--color-gold-deep)'"
        onblur="this.style.borderColor='var(--color-footer-divider)'"
      >
      <input
        type="email"
        name="email"
        placeholder="Email address"
        required
        style="flex:2;min-width:180px;padding:0.5rem 1rem;border:1px solid var(--color-footer-divider);border-radius:4px;background:var(--color-bg-primary);color:var(--color-text-primary);outline:none;"
        onfocus="this.style.borderColor='var(--color-gold-deep)'"
        onblur="this.style.borderColor='var(--color-footer-divider)'"
      >
      <button
        type="submit"
        class="btn btn-primary"
        :disabled="loading"
        :style="loading ? 'opacity:0.6;cursor:not-allowed' : ''"
      >
        <span x-show="!loading">Subscribe</span>
        <span x-show="loading">Sending&hellip;</span>
      </button>
    </div>
  </form>
{% endif %}
