{% extends "base.html" %}
{% block title %}Subscription Confirmed{% endblock %}
{% block content %}
<section class="max-w-2xl mx-auto px-4 py-20 text-center">
  <h1 class="text-3xl font-bold text-brand-primary mb-4">You're in!</h1>
  <p class="text-text-secondary text-lg">
    Thanks, {{ member.first_name }}. Your email address has been confirmed and you're now subscribed to the SoHo Pittsburgh mailing list.
  </p>
  <a href="{% url 'core:home' %}" class="mt-8 inline-block px-8 py-3 bg-brand-primary text-white font-semibold rounded hover:opacity-90 transition">
    Back to Home
  </a>
</section>
{% endblock %}
